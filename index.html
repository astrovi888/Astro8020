<script>
// Rows: [German, English, frequency band (approx. rank ceiling of hardest word), level, theme, grammar note]
const OLD=[
["Ich habe keine Zeit.","I don’t have time.",100,"A1","Daily","keine negates nouns used without an article; nicht negates verbs and adjectives."],
["Das ist mein Haus.","That is my house.",100,"A1","Home","Haus is neuter, so das Haus. mein- takes the same endings as ein-: no ending for neuter nominative."],
["Wo ist der Bahnhof?","Where is the train station?",200,"A1","Daily","Question word first, verb second. Bahnhof is masculine: der Bahnhof."],
["Ich arbeite jeden Tag.","I work every day.",200,"A1","Work","Time expressions like jeden Tag take the accusative."],
["Ich möchte bitte ein Wasser.","I would like a water, please.",200,"A1","Restaurant","möchte is the polite form of wanting. Wasser is neuter: ein Wasser (accusative looks the same)."],
["Kannst du mir helfen?","Can you help me?",200,"A1","Daily","helfen takes the dative: mir, not mich. With a modal verb, the infinitive goes to the end."],
["Wir essen heute im Restaurant.","We are eating at a restaurant today.",300,"A1","Restaurant","im = in dem. in + dative answers “where?”. The verb stays in second position."],
["Das Essen ist fertig.","The food is ready.",300,"A1","Kitchen","Das Essen is a verb used as a noun, and these are always neuter."],
["Das Wasser kocht schon.","The water is already boiling.",300,"A1","Kitchen","Wasser is neuter, so das Wasser. schon = already."],
["Ich fahre mit dem Zug nach Berlin.","I’m taking the train to Berlin.",300,"A1","Daily","mit always takes the dative: dem Zug. nach is used for cities and countries."],
["Ich muss morgen früh aufstehen.","I have to get up early tomorrow.",300,"A2","Daily","aufstehen is separable. With a modal verb it stays together as one infinitive at the end."],
["Ich habe gestern lange gearbeitet.","I worked for a long time yesterday.",300,"A2","Work","Perfekt = haben + past participle at the end of the sentence."],
["Ich weiß nicht, was ich sagen soll.","I don’t know what I’m supposed to say.",300,"B1","Daily","In an indirect question the verb moves to the end. weiß is irregular (wissen)."],
["Der Hund ist im Garten.","The dog is in the garden.",400,"A1","Animals","im = in dem. Location (“where?”) takes the dative. Hund is masculine: der Hund."],
["Ich gehe mit dem Hund spazieren.","I’m going for a walk with the dog.",400,"A1","Animals","mit + dative: dem Hund. spazieren gehen = to go for a walk."],
["Haben Sie einen Tisch für zwei Personen?","Do you have a table for two people?",400,"A1","Restaurant","Tisch is masculine, so the accusative is einen Tisch. für always takes the accusative."],
["Mach bitte das Fenster zu.","Please close the window.",400,"A1","Home","Imperative of a separable verb (zumachen): the prefix goes to the end. Fenster is neuter."],
["Wenn es regnet, bleibe ich zu Hause.","If it rains, I stay at home.",400,"A2","Outdoors","wenn sends the verb to the end of its clause. The main clause then starts with its verb."],
["Ich freue mich auf das Wochenende.","I’m looking forward to the weekend.",400,"B1","Work","sich freuen auf + accusative is for future events (über is for things happening now)."],
["Die Katze schläft auf dem Sofa.","The cat is sleeping on the sofa.",500,"A1","Animals","auf + dative when the cat is already there (where?). Katze is feminine: die Katze."],
["Wir kochen heute Abend zusammen.","We’re cooking together this evening.",500,"A1","Kitchen","heute Abend = this evening. Abend is masculine, but no article is needed here."],
["Ich stelle die Lampe auf den Tisch.","I’m putting the lamp on the table.",500,"A2","Home","Movement (where to?) means accusative: auf den Tisch. Compare: Die Lampe steht auf dem Tisch."],
["Hätte ich mehr Zeit, würde ich öfter wandern gehen.","If I had more time, I would go hiking more often.",500,"B2","Outdoors","Unreal condition (Konjunktiv II). Dropping wenn puts the verb first: Hätte ich…"],
["Die Wohnung hat zwei Zimmer und einen Balkon.","The apartment has two rooms and a balcony.",600,"A1","Home","haben takes the accusative. Balkon is masculine: einen Balkon. Wohnung is feminine."],
["Ich hätte gern die Rechnung, bitte.","I’d like the bill, please.",600,"A2","Restaurant","hätte gern is a polite request. Rechnung is feminine: die Rechnung."],
["Obwohl ich müde war, habe ich weitergearbeitet.","Although I was tired, I kept working.",600,"B1","Work","obwohl sends the verb to the end. After the clause, the main clause verb comes first: habe ich."],
["Der Wald ist sehr ruhig.","The forest is very quiet.",700,"A1","Outdoors","Wald is masculine: der Wald. sehr + adjective = very."],
["Der Chef hat heute keine Zeit für das Meeting.","The boss has no time for the meeting today.",700,"A2","Work","für + accusative. Meeting is neuter: das Meeting."],
["Ich räume die Küche auf, bevor die Gäste kommen.","I tidy the kitchen before the guests arrive.",800,"B1","Home","aufräumen is separable. bevor sends the verb to the end. Küche is feminine: die Küche."],
["Kannst du bitte die Zwiebeln schneiden?","Can you please cut the onions?",800,"A2","Kitchen","Zwiebeln is plural, so die. The infinitive schneiden goes to the end with a modal verb."],
["Der Hund, den wir gestern gesehen haben, gehört meiner Nachbarin.","The dog we saw yesterday belongs to my neighbor.",800,"B1","Animals","den = masculine accusative relative pronoun (object of gesehen). gehören takes the dative: meiner Nachbarin."],
["Wir wandern am Wochenende in den Bergen.","We hike in the mountains on the weekend.",900,"A2","Outdoors","am = an dem. Dative plural adds -n: in den Bergen."],
["Das Pferd steht auf der Wiese.","The horse is standing in the meadow.",900,"A2","Animals","Germans say auf der Wiese. Wiese is feminine, dative: der. Pferd is neuter: das Pferd."],
["Die Besprechung wurde auf nächste Woche verschoben.","The meeting was postponed until next week.",900,"B2","Work","Passive: wurde + past participle. The doer is not mentioned."]
];
const G={
mod:"Modal verb: it takes the second slot and the main verb goes to the end as an infinitive.",
dat:"mit, bei, von, zu, nach, aus, seit always take the dative.",
acc:"Direct objects take the accusative. Only masculine changes: der → den, ein → einen.",
sep:"Separable verb: the prefix jumps to the end of the main clause.",
perf:"Perfekt: haben or sein + past participle, with the participle at the end.",
sub:"In a clause with weil, dass, wenn, obwohl, the conjugated verb goes to the end.",
v2:"Verb second: whatever comes first, the conjugated verb is the second element.",
q:"Questions: a question word comes first, or the verb leads in yes/no questions.",
neg:"kein negates nouns; nicht negates verbs, adjectives and everything else.",
wo:"Two-way prepositions: dative for location (wo?), accusative for movement (wohin?).",
refl:"Reflexive verb: the pronoun (mich, dich, sich…) belongs with the verb.",
imp:"Imperative: the verb comes first.",
ko2:"Konjunktiv II (hätte, wäre, würde) expresses polite or unreal wishes.",
rel:"Relative clause: the pronoun matches the noun’s gender, its case comes from its job in the clause, and the verb goes to the end.",
inf:"Infinitive with zu: zu stands right before the infinitive at the end of the clause.",
idm:"Fixed expression: feelings and impressions use the dative (mir, dir, ihm…).",
gen:"Learn every noun with its article: gender is rarely guessable.",
comp:"Comparison: adjective + -er, then als.",
sein:"sein and haben are irregular, so learn them as they are.",
time:"Times: um + clock time, am + day, im + month or season."};
const note=t=>t.split("+").every(x=>G[x])?t.split("+").map(x=>G[x]).join(" "):t;

{t:"Mein Tag",l:"A1",s:`Ich heiße Lena.|My name is Lena.

{t:"Im Café",l:"A1",s:`Kellner: Guten Tag! Was möchten Sie trinken?|Waiter: Good day! What would you like to drink?

Kellner: Gern. Möchten Sie Zucker?|Waiter: Gladly. Would you like sugar?
Gast: Nein, danke. Ohne Zucker.|Guest: No, thank you. Without sugar.
Kellner: Hier ist Ihr Tee.|Waiter: Here is your tea.

{t:"Der Hund im Park",l:"A2",s:`Jeden Sonntag gehen Tom und seine Schwester im Park spazieren.|Every Sunday Tom and his sister go for a walk in the park.
Sie haben einen kleinen Hund, der Max heißt.|They have a small dog named Max.
Heute scheint die Sonne, und der Hund läuft schnell über die Wiese.|Today the sun is shining, and the dog runs quickly across the meadow.
Plötzlich sieht Max eine Katze und rennt hinterher.|Suddenly Max sees a cat and runs after it.
Tom ruft: „Max, komm zurück!“|Tom shouts: “Max, come back!”

 <p class="en" style="font-size:12px;margin-top:12px">Word list and translations: Lenguia (lenguia.com). ✓ = learned in Words.</p>`}
function transView(){app.innerHTML=dseg()+`<div class="box"><div class="row"><button class="btn${tdir=="en|de"?" p":""}" data-td="en|de">English → German</button><button class="btn${tdir=="de|en"?" p":""}" data-td="de|en">German → English</button></div>
 <label for="tx">${tdir=="en|de"?"English":"German"} text (up to 500 characters)</label><textarea id="tx" class="ta" rows="3" maxlength="500"></textarea><div style="height:10px"></div><button class="btn p" data-do="trans">Translate</button><div id="to" style="margin-top:12px"></div>
 <p class="en" style="font-size:13px;margin:12px 0 0">Machine translation by MyMemory: good for words and short sentences, but it can be wrong, especially with idioms. Your text is sent to translated.net to get the result (see Privacy). The free limit is about 5,000 characters per day per network.</p></div>`}
async function doTrans(){const x=$("tx").value.trim();if(!x)return;$("to").innerHTML=`<p class="en">Translating…</p>`;
 try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(x)+"&langpair="+encodeURIComponent(tdir)),j=await r.json();
  if(j.responseStatus!=200)throw new Error("limit");
  const txt=new DOMParser().parseFromString(j.responseData.translatedText,"text/html").documentElement.textContent,de=tdir=="en|de"?txt:x;
  $("to").innerHTML=`<div class="note" style="margin:0"><div style="font-size:20px">${tdir=="en|de"?col(esc(txt)):esc(txt)}</div><div style="margin-top:8px">${spk(de)}</div></div>`;
  ST.tn=(ST.tn||0)+1;save()}
 catch(e){$("to").innerHTML=`<p class="en">Couldn’t translate right now (daily limit reached or no connection). Try again later, or use dict.cc or DeepL.</p>`}}
function doAct(a,v){
 if(a=="trans")doTrans();
 else if(a=="tx"){dtab="t";tdir=/[äöüß]|\b(der|die|das|ich|und|nicht|ist)\b/i.test(v)?"de|en":"en|de";render();$("tx").value=v}
 else if(a=="mgstart")mgStart();else if(a=="mgagain")mgSetup()}

/* ---- Word Match Blitz ---- */
let MG=null;
const eshort=w=>w.en.split(/[;(,]/)[0].trim();
const mgPool=()=>WD.filter(w=>w.rank<=500&&"nvjdm".includes(w.pos)&&eshort(w).length<=20);
function mgStop(){if(MG&&MG.iv)clearInterval(MG.iv);MG=null}
function mgNew(){const u=new Set(MG.L.map(x=>x.rank)),e=new Set(MG.R.map(eshort));for(let n=0;n<200;n++){const w=MG.pool[Math.floor(Math.random()*MG.pool.length)];if(!u.has(w.rank)&&!e.has(eshort(w)))return w}return MG.pool[0]}
async function mgBoard(){if(!sb)return`<p class="en">The online leaderboard isn’t switched on yet.</p>`;
 try{const r=await sb.from("match_scores").select("name,score").order("score",{ascending:false}).limit(10);if(r.error)throw r.error;
  return r.data.length?`<div class="lb">${r.data.map((x,k)=>`<div class="lr${ST.lb&&x.name==ST.nick?" me":""}" style="grid-template-columns:28px 1fr 60px"><span>${k+1}</span><span class="nm">${esc(x.name)}</span><span>${x.score}</span></div>`).join("")}</div>`:`<p class="en">No scores yet. Be the first.</p>`}
 catch(e){return`<p class="en">Leaderboard unavailable right now.</p>`}}
async function mgSubmit(sc){if(!sb||!USER||!ST.lb||!ST.nick||sc<1)return false;
 try{const r=await sb.from("match_scores").select("score").eq("user_id",USER.id).maybeSingle();if(r.error)throw r.error;
  if(!r.data||sc>r.data.score){const w=await sb.from("match_scores").upsert({user_id:USER.id,name:ST.nick,score:sc,updated_at:new Date().toISOString()});if(w.error)throw w.error}return true}catch(e){return false}}
function mgSetup(){mgStop();
 app.innerHTML=`<div class="box"><h2 style="margin:0 0 6px;font-size:22px">Word Match Blitz ⏱️</h2><p class="en" style="margin:0 0 10px">60 seconds. Match each German word with its English meaning. Every pair scores a point and a wrong match costs 2 seconds. Words come from the 500 most common German words.</p>
 <div class="meta"><span>Your best</span><b style="color:var(--fg)">${ST.mbest||0}</b></div><div style="height:14px"></div><button class="btn p" data-do="mgstart">Start</button></div>
 <div class="box" style="margin-top:12px"><b>Top 10 worldwide</b><div id="mgb"><p class="en">Loading…</p></div>${sb&&!(ST.lb&&ST.nick)?`<p class="en" style="font-size:13px;margin:10px 0 0">To post your score, log in and join the leaderboard under Progress → Ranks.</p>`:""}</div>`;
 mgBoard().then(h=>{const el=$("mgb");if(el&&tab=="m"&&!MG)el.innerHTML=h})}
function mgStart(){mgStop();MG={pool:mgPool(),L:[],R:[],sel:null,score:0,end:Date.now()+60000,done:false,iv:0};
 for(let k=0;k<6;k++){const w=mgNew();MG.L.push(w);MG.R.push(w)}MG.R=shuf(MG.R);
 app.innerHTML=`<div class="box"><div class="meta"><span>Matched <b id="ms" style="color:var(--fg)">0</b></span><span id="mt">60s</span></div><div class="bar"><i id="mb" style="width:100%;animation:none"></i></div><div id="mgg" class="mg"></div></div>`;
 mgGrid();MG.iv=setInterval(mgTick,200)}
function mgGrid(){const sl=(s,k)=>MG.sel&&MG.sel[0]==s&&MG.sel[1]==k?" sel":"";
 $("mgg").innerHTML=`<div>${MG.L.map((w,k)=>`<button class="tile${sl("L",k)}" data-mg="L${k}">${w.art?`<span class="${w.art}">${w.art}</span> `:""}${w.de}</button>`).join("")}</div><div>${MG.R.map((w,k)=>`<button class="tile${sl("R",k)}" data-mg="R${k}">${esc(eshort(w))}</button>`).join("")}</div>`}
function mgTick(){if(!MG||MG.done)return;const left=Math.max(0,(MG.end-Date.now())/1000),t=$("mt"),b=$("mb");if(t)t.textContent=Math.ceil(left)+"s";if(b)b.style.width=Math.min(100,left/60*100)+"%";if(left<=0)mgEnd()}
function mgTap(s,k){if(!MG||MG.done)return;
 if(!MG.sel||MG.sel[0]==s){MG.sel=[s,k];sfx.tap();return mgGrid()}
 const a=MG.sel[0]=="L"?MG.sel[1]:k,b=MG.sel[0]=="L"?k:MG.sel[1];MG.sel=null;
 if(MG.L[a].rank==MG.R[b].rank){MG.score++;sfx.good();const nw=mgNew();MG.L[a]=nw;MG.R[b]=nw;$("ms").textContent=MG.score}
 else{MG.end-=2000;sfx.bad();shake()}
 mgGrid()}
async function mgEnd(){if(!MG||MG.done)return;MG.done=true;clearInterval(MG.iv);const sc=MG.score,nb=sc>(ST.mbest||0);if(nb)ST.mbest=sc;
 addXP(Math.min(40,sc*2));save();sfx.done();burst();checkAch();
 app.innerHTML=`<div class="box"><div class="sent" style="min-height:0">Time’s up!</div><div class="grid"><div class="stat"><b>${sc}</b><span>pairs matched</span></div><div class="stat"><b>${ST.mbest||0}</b><span>${nb?"new personal best":"your best"}</span></div></div><div id="mgs" class="en" style="font-size:14px;margin-bottom:10px"></div><div class="row"><button class="btn" data-do="mgagain">Menu</button><button class="btn p" data-do="mgstart">Play again</button></div></div>
 <div class="box" style="margin-top:12px"><b>Top 10 worldwide</b><div id="mgb"><p class="en">Loading…</p></div></div>`;
 const posted=await mgSubmit(sc);if($("mgs")&&tab=="m")$("mgs").textContent=posted?"Score posted to the leaderboard.":(sb&&!(ST.lb&&ST.nick)?"Join the leaderboard in Progress → Ranks to post your score.":"");
 const h=await mgBoard();if($("mgb")&&tab=="m")$("mgb").innerHTML=h}

/* ---- events ---- */
document.addEventListener("click",e=>{let b;const t=e.target;
 if(b=t.closest("[data-say]"))speak(b.dataset.say,b.dataset.slow);
 else if(b=t.closest("[data-pt]")){ptab=b.dataset.pt;render()}
 else if(b=t.closest("[data-set]"))setting(b.dataset.set);
 else if(b=t.closest("[data-lb]")){e.preventDefault();lbAct(b.dataset.lb)}
 else if(b=t.closest("[data-st]")){rs=+b.dataset.st;readView();window.scrollTo&&scrollTo(0,0)}
 else if(b=t.closest("[data-tr]")){$("tr"+b.dataset.tr).classList.toggle("hide");sfx.tap()}
 else if(b=t.closest("[data-qa]"))quizAns(+b.dataset.qa);
 else if(b=t.closest("[data-dt]")){dtab=b.dataset.dt;render()}
 else if(b=t.closest("[data-td]")){tdir=b.dataset.td;transView()}
 else if(b=t.closest("[data-mg]"))mgTap(b.dataset.mg[0],+b.dataset.mg.slice(1));
 else if(b=t.closest("[data-do]")){e.preventDefault();doAct(b.dataset.do,b.dataset.v)}
 else if(b=t.closest("[data-rd]")){const w=STORY[rs].w;$("wm").innerHTML=`<div class="note"><b>Model answer</b><div>${col(esc(w[1]))} ${spk(w[1])}</div><div class="en" style="font-size:15px;margin-top:6px">${esc(w[2])}</div></div>`;$("wm").classList.remove("hide")}});
document.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.dataset&&e.target.dataset.tr!==undefined){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{if(e.target.id!="dq")return;dres(e.target.value);clearTimeout(dt);
 dt=setTimeout(()=>{const x=nz(e.target.value.trim());if(x.length>=3&&dsearch(x).w.length){ST.dq=ST.dq||{};if(Object.keys(ST.dq).length<400){ST.dq[x]=1;save();checkAch()}}},1000)});
document.addEventListener("change",e=>{if(e.target.id=="bb"||e.target.id=="bl"||e.target.id=="bp"){bsel={r:$("bb").value,l:$("bl").value,p:$("bp").value};dbrowse()}});
$("nav").addEventListener("click",e=>{if(e.target.closest("[data-t]")){rs=-1;mgStop()}},true);
$("snd").onclick=()=>{ST.snd=ST.snd===false;save();sndBtn();sfx.good()};
if(ST.wv!==2){for(const k in ST.cards)if(k[0]=="w")delete ST.cards[k];ST.wv=2;save()}
sndBtn();setTimeout(checkAch,1500);
</script></body></html>
